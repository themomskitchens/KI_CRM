<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Survey | Kavish Informatics CRM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">KI</div>

<div>

<h2>Client Survey</h2>

<p>Kavish Informatics</p>

</div>

</header>

<!-- Company Details -->

<section class="card">

<h3>🏢 Company Details</h3>

<input type="text" placeholder="Company Name">

<input type="text" placeholder="Industry">

<input type="text" placeholder="Website">

<input type="text" placeholder="Office Address">

<input type="number" placeholder="No. of Employees">

</section>

<!-- Contact Person -->

<section class="card">

<h3>👤 Contact Person</h3>

<input type="text" placeholder="IT Head Name">

<input type="text" placeholder="HR Name">

<input type="text" placeholder="Admin Name">

<input type="tel" placeholder="Mobile Number">

<input type="email" placeholder="Email Address">

</section>

<!-- Assets -->

<section class="card">

<h3>💻 IT Assets</h3>

<input type="number" placeholder="Laptops">

<input type="number" placeholder="Desktops">

<input type="number" placeholder="Printers">

<input type="number" placeholder="Servers">

<input type="number" placeholder="Routers">

<input type="number" placeholder="Switches">

<input type="number" placeholder="CCTV Cameras">

</section>

<!-- Google Workspace -->

<section class="card">

<h3>☁️ Google Workspace</h3>

<select>

<option>Using Google Workspace?</option>

<option>Yes</option>

<option>No</option>

</select>

<input type="number" placeholder="Total Users">

<input type="text" placeholder="Admin Name">

</section>

<!-- Vendor -->

<section class="card">

<h3>🤝 Vendor Details</h3>

<input type="text" placeholder="Current IT Vendor">

<input type="text" placeholder="Rental Vendor">

<input type="text" placeholder="AMC Vendor">

<input type="text" placeholder="Internet Provider">

</section>

<!-- Problems -->

<section class="card">

<h3>⚠ Current Issues</h3>

<label><input type="checkbox"> Slow Laptop</label>

<label><input type="checkbox"> Printer Issue</label>

<label><input type="checkbox"> Internet Issue</label>

<label><input type="checkbox"> Google Workspace Issue</label>

<label><input type="checkbox"> Email Issue</label>

<label><input type="checkbox"> Network Issue</label>

<label><input type="checkbox"> CCTV Issue</label>

</section>

<!-- Lead -->

<section class="card">

<h3>🔥 Lead Status</h3>

<select>

<option>Cold</option>

<option>Warm</option>

<option>Hot</option>

</select>

<input type="date">

</section>

<!-- Notes -->

<section class="card">

<h3>📝 Notes</h3>

<textarea rows="5" placeholder="Write meeting notes..."></textarea>

</section>

<button id="submitSurvey">

Submit Survey

</button>

</div>

<script src="survey.js"></script>

</body>

  </html>
